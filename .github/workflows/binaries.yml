name: binaries

on:
  push:
    branches: [main]
    paths:
      - 'core/tools/ai/**'
      - 'core/tools/db/supabase/**'
      - '.github/smoke-binaries.sh'
      - '.github/workflows/binaries.yml'
  pull_request:
    paths:
      - 'core/tools/ai/**'
      - 'core/tools/db/supabase/**'
      - '.github/smoke-binaries.sh'
      - '.github/workflows/binaries.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: download, extract and run every binary tool
        run: bash .github/smoke-binaries.sh
