name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || fail=1
          done < <(find core install.sh -name '*.sh')
          exit $fail

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          severity: error

  smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: download, extract and run every binary tool
        run: bash .github/smoke-binaries.sh
