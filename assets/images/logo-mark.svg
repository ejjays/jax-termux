<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 148" width="148" height="148">
  <defs>
    <filter id="m-cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m-green-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="m-circuit" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 H6 M14 10 H20 M10 0 V6 M10 14 V20" stroke="#00e5ff" stroke-width="0.5" opacity="0.25"/>
      <circle cx="10" cy="10" r="1.2" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
      <circle cx="0" cy="0" r="0.7" fill="#00e5ff" opacity="0.18"/>
      <circle cx="20" cy="0" r="0.7" fill="#00e5ff" opacity="0.18"/>
      <circle cx="0" cy="20" r="0.7" fill="#00e5ff" opacity="0.18"/>
      <circle cx="20" cy="20" r="0.7" fill="#00e5ff" opacity="0.18"/>
    </pattern>
    <radialGradient id="m-hex-face" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f2d3f"/>
      <stop offset="100%" stop-color="#071a27"/>
    </radialGradient>
  </defs>

  <polygon points="74,6 132,38 132,110 74,142 16,110 16,38"
    fill="#00bcd4" opacity="0.07"/>
  <polygon points="74,8 130,39 130,109 74,140 18,109 18,39"
    fill="url(#m-hex-face)"/>
  <polygon points="74,8 130,39 130,109 74,140 18,109 18,39"
    fill="url(#m-circuit)" opacity="1"/>
  <polygon points="74,8 130,39 130,109 74,140 18,109 18,39"
    fill="none" stroke="#00e5ff" stroke-width="3"
    filter="url(#m-cyan-glow)" opacity="0.9"/>
  <polygon points="74,17 121,43 121,105 74,131 27,105 27,43"
    fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>

  <circle cx="74"  cy="8"   r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>
  <circle cx="130" cy="39"  r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>
  <circle cx="130" cy="109" r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>
  <circle cx="74"  cy="140" r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>
  <circle cx="18"  cy="109" r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>
  <circle cx="18"  cy="39"  r="2.5" fill="#00e5ff" opacity="0.75" filter="url(#m-cyan-glow)"/>

  <g fill="none" stroke="#39ff14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#m-green-glow)">
    <polyline points="52,60 70,60 70,92"/>
    <line x1="90" y1="92" x2="90" y2="92"/>
  </g>
</svg>
