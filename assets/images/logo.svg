<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 176" width="470" height="176">
  <defs>
    <filter id="jax-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="jax-text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
  </defs>

  <!-- Corner brackets -->
  <g stroke="#00bcd4" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="30,6 6,6 6,30"/>
    <polyline points="440,6 464,6 464,30"/>
    <polyline points="6,146 6,170 30,170"/>
    <polyline points="464,146 464,170 440,170"/>
  </g>

  <!-- JAX block letters -->
  <text x="50" y="52"
    font-family="monospace, 'Courier New'"
    font-size="20" font-weight="bold"
    letter-spacing="0"
    fill="url(#jax-text-grad)"
    filter="url(#jax-glow)"
    xml:space="preserve">
    <tspan x="50" dy="0">      _|    _|_|    _|      _|</tspan>
    <tspan x="50" dy="24">      _|  _|    _|    _|  _|</tspan>
    <tspan x="50" dy="24">      _|  _|_|_|_|      _|</tspan>
    <tspan x="50" dy="24">_|    _|  _|    _|    _|  _|</tspan>
    <tspan x="50" dy="24">  _|_|    _|    _|  _|      _|</tspan>
  </text>
</svg>
